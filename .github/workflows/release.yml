name: Release

# The release factory, in two halves with a person between them.
#
#   1. A tag `<id>-v<semver>` builds the package from this repository's own
#      `extensions/<id>/`, writes the manifest, and leaves a DRAFT release with
#      the zip and the manifest (job `publish`).
#   2. The maintainer runs `node scripts/publish-release.mjs <tag>`, which signs
#      the manifest with the release key on their machine, uploads the signature
#      and publishes the draft. Publishing fires this workflow again, and job
#      `catalogue` checks the signature against `scripts/release-public-key.pem`
#      before pointing the catalogue at the release.
#
# The key is never a repository secret. The signed manifest is what every
# install trusts, and anyone who can push here can already rewrite the
# catalogue; a key held here would let them sign as well. Aegis core keeps the
# same rule for its installer and agent releases (`releaseKey.js`).
#
# Nothing is assembled by hand any more. The reason the code moved out of the
# Aegis tree is that a zip built from the core repository described a different
# set of bytes than the one the store served; one builder reading one source is
# what keeps that from coming back.
#
# `catalog.yml` stays the reader. It validates the catalogue and fetches every
# referenced asset on every push, this workflow's push included, so `index.json`
# has one writer (the `catalogue` job below) and one checker (that workflow).

on:
  push:
    tags:
      - '*-v*'
  # Published by scripts/publish-release.mjs, under the maintainer's own token.
  # A release published with this workflow's token would not fire it.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to publish, <id>-v<semver>'
        required: true

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      # The tag itself, also when re-run by hand: a dispatch runs on main, and
      # main may have moved past what was tagged.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      # `<id>-v<semver>`, split on the last `-v`. Refused rather than guessed at: a
      # tag this cannot read would publish assets under a name `build-index.mjs`
      # never derives, and the catalogue would point at a release nobody can
      # download.
      - name: Read the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"
          ID="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if ! printf '%s' "$ID" | grep -Eqx '[a-z0-9]([a-z0-9-]*[a-z0-9])?'; then
            echo "tag $TAG: \"$ID\" is not an extension id"; exit 1
          fi
          if ! printf '%s' "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "tag $TAG: \"$VERSION\" is not semver"; exit 1
          fi
          if [ ! -f "extensions/$ID/store.json" ]; then
            echo "tag $TAG: extensions/$ID/store.json does not exist"; exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The field the tag cannot see. `extension.json` carries `release`, and
      # `extensionInstaller` compares it with the signed manifest: an install
      # refuses `release_mismatch` when the two disagree. Nothing above reads it,
      # so without this step a stale field publishes three signed assets that
      # every install downloads and then rejects at the last check. It went
      # unnoticed through 0.0.0 by coincidence -- the field already said 0.0.0.
      #
      # Checked before the suite rather than after: it costs a file read, and the
      # failure it prevents is the expensive kind.
      - name: Refuse a tag the manifest does not agree with
        run: |
          set -euo pipefail
          ID='${{ steps.tag.outputs.id }}'
          VERSION='${{ steps.tag.outputs.version }}'
          DECLARED=$(node -e 'const fs = require("fs");
            try { process.stdout.write(String(JSON.parse(fs.readFileSync("extensions/" + process.argv[1] + "/extension.json", "utf8")).release || "")); }
            catch (e) { process.stdout.write(""); }' "$ID")
          if [ "$DECLARED" != "$VERSION" ]; then
            echo "tag says $VERSION, extensions/$ID/extension.json says \"$DECLARED\" (empty means the file is missing or will not parse)."
            echo 'Set "release" in extension.json to the version you are tagging, commit it, and tag again.'
            exit 1
          fi
          echo "extension.json declares $DECLARED, which matches the tag"

      # Before anything is published, not after. A release is three assets an
      # install has already downloaded by the time anyone reads a failed run.
      - name: Run the suite
        run: npm test

      # The zip root holds what `extensions/<id>/` holds: `extension.json` at the
      # top, then `backend/` and `frontend/`. No wrapping folder, because the
      # loader reads `extension.json` at the root of the unpacked directory.
      #
      # What stays out: both test folders, the catalogue metadata that belongs to
      # this repository rather than to the package, the card image (served from
      # `main`, so fixing a crop costs no release), and any AI tooling note. For
      # `deploy` that is 36 files kept and 36 dropped, which is the shape the
      # published 0.0.0 package already has.
      - name: Build the package
        id: pack
        run: |
          set -euo pipefail
          ID='${{ steps.tag.outputs.id }}'
          VERSION='${{ steps.tag.outputs.version }}'
          ZIP="$RUNNER_TEMP/$ID-$VERSION.zip"
          ( cd "extensions/$ID" && zip -r -q "$ZIP" . \
              -x 'backend/tests/*' \
              -x 'frontend/tests/*' \
              -x 'store.json' \
              -x 'CHANGELOG.md' \
              -x 'card.png' \
              -x 'CLAUDE.md' \
              -x '*/CLAUDE.md' )
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # The exclusion list checked against the bytes rather than trusted. A `-x`
      # pattern that quietly matched nothing would put this extension's tests, and
      # whatever notes sit beside them, on a customer's audit server.
      - name: Refuse a package carrying what must not ship
        run: |
          set -euo pipefail
          FORBIDDEN='(^|/)(backend/tests/|frontend/tests/|store\.json$|CHANGELOG\.md$|card\.png$|CLAUDE\.md$)'
          NAMES=$(unzip -Z1 '${{ steps.pack.outputs.zip }}')
          if printf '%s\n' "$NAMES" | grep -Eq "$FORBIDDEN"; then
            echo 'the package carries a file that must not ship:'
            printf '%s\n' "$NAMES" | grep -E "$FORBIDDEN"
            exit 1
          fi
          if ! printf '%s\n' "$NAMES" | grep -Eqx '(\./)?extension\.json'; then
            echo 'extension.json is not at the zip root, so the loader will not find it'
            exit 1
          fi
          echo "package contents ($(printf '%s\n' "$NAMES" | grep -c .) entries):"
          printf '%s\n' "$NAMES"

      # A `\b` written into a regex through a shell heredoc arrives as a literal
      # 0x08. The pattern then matches nothing, quietly, and a test asserting on
      # an empty list still passes. Core found one that had been committed for
      # months. It costs a second to rule out, and the moment it matters is the
      # moment bytes get signed and handed to every install.
      #
      # Text files only: `card.png` is excluded already (it does not ship) and any
      # future binary would trip this for no reason. LF, CR and tab are the three
      # control bytes a source file is allowed.
      - name: Refuse a package carrying a stray control byte
        run: |
          set -uo pipefail
          ID='${{ steps.tag.outputs.id }}'
          rc=0
          while IFS= read -r f; do
            if grep -qP '[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]' "$f"; then
              echo "STRAY CONTROL BYTE  $f"
              grep -naP '[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]' "$f" | head -5
              rc=1
            fi
          done < <(find "extensions/$ID" -type f \
                     \( -name '*.js' -o -name '*.mjs' -o -name '*.json' -o -name '*.md' \
                        -o -name '*.html' -o -name '*.css' -o -name '*.ps1' \))
          if [ $rc -ne 0 ]; then
            echo 'Most likely a file written through a shell heredoc, which collapses'
            echo 'an escape one layer too early. Rewrite that line without one.'
            exit 1
          fi
          echo 'no stray control bytes'

      # Writes the final bytes. The signature covers them exactly as written, so
      # nothing reformats this file afterwards.
      - name: Write the manifest
        id: manifest
        run: |
          set -euo pipefail
          ID='${{ steps.tag.outputs.id }}'
          VERSION='${{ steps.tag.outputs.version }}'
          node scripts/make-manifest.mjs "$ID" "$VERSION" '${{ steps.pack.outputs.zip }}'
          echo "path=$RUNNER_TEMP/$ID-$VERSION.manifest.json" >> "$GITHUB_OUTPUT"

      # A draft with two of the three assets, named exactly as `build-index.mjs`
      # derives them. Not signed: the signature is made on the maintainer machine
      # by scripts/publish-release.mjs, which also publishes the draft. Until
      # then neither the catalogue nor any install can see it. A `preview`
      # extension is marked prerelease, so the two channels stay distinguishable
      # from the release list alone.
      - name: Cut a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID='${{ steps.tag.outputs.id }}'
          VERSION='${{ steps.tag.outputs.version }}'
          FIELD='process.stdout.write(String(require("./extensions/" + process.argv[1] + "/store.json")[process.argv[2]] || ""))'
          NAME=$(node -e "$FIELD" "$ID" name)
          CHANNEL=$(node -e "$FIELD" "$ID" channel)
          ARGS=(--draft --verify-tag --title "$NAME $VERSION" --notes-file "extensions/$ID/CHANGELOG.md")
          if [ "$CHANNEL" = 'preview' ]; then ARGS+=(--prerelease); fi
          gh release create "${{ steps.tag.outputs.tag }}" \
            '${{ steps.pack.outputs.zip }}' \
            '${{ steps.manifest.outputs.path }}' \
            "${ARGS[@]}"
          echo 'Draft ready. Sign and publish it on the maintainer machine:'
          echo '  node scripts/publish-release.mjs ${{ steps.tag.outputs.tag }}'

  # Runs when a release is published, on `main` rather than on the tag: the
  # catalogue is a file on a branch, and a commit made from a detached tag
  # checkout would land nowhere.
  catalogue:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.1'

      - name: Read the tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          ID="${TAG%-v*}"
          VERSION="${TAG##*-v}"
          if ! printf '%s' "$ID" | grep -Eqx '[a-z0-9]([a-z0-9-]*[a-z0-9])?' \
             || ! printf '%s' "$VERSION" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+' \
             || [ ! -f "extensions/$ID/store.json" ]; then
            echo "release $TAG is not an extension release, so the catalogue does not move"; exit 1
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # The last gate before every install is offered the release. Anyone who can
      # push here can publish a release; only the key holder can produce a
      # signature that verifies against the key installs trust.
      - name: Refuse a release whose signature installs would reject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID='${{ steps.tag.outputs.id }}'
          VERSION='${{ steps.tag.outputs.version }}'
          M="$RUNNER_TEMP/$ID-$VERSION.manifest.json"
          gh release download '${{ steps.tag.outputs.tag }}' \
            -p "$ID-$VERSION.manifest.json" -p "$ID-$VERSION.manifest.json.sig" -D "$RUNNER_TEMP"
          base64 -d "$M.sig" > "$RUNNER_TEMP/sig.bin"
          openssl dgst -sha256 -verify scripts/release-public-key.pem -signature "$RUNNER_TEMP/sig.bin" "$M"

      # Read back from the release rather than carried over from the build, so
      # what the catalogue describes is what somebody can actually download: the
      # manifest the step above downloaded and verified.
      - name: Point store.json at the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID='${{ steps.tag.outputs.id }}'
          VERSION='${{ steps.tag.outputs.version }}'
          TAG='${{ steps.tag.outputs.tag }}'
          AT=$(gh release view "$TAG" --json publishedAt -q .publishedAt)
          node - "$ID" "$VERSION" "$RUNNER_TEMP/$ID-$VERSION.manifest.json" "$AT" <<'JS'
          const fs = require('fs');
          const [id, version, manifestPath, at] = process.argv.slice(1);
          const p = `extensions/${id}/store.json`;
          const store = JSON.parse(fs.readFileSync(p, 'utf8'));
          const m = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          // Size and digest from the signed manifest, not recomputed. The
          // installer compares the zip it downloaded against these exact values,
          // so a second measurement here could only ever disagree with the one
          // that counts.
          store.latest = { version, publishedAt: at, size: m.size, sha256: m.sha256 };
          store.releases = Array.from(new Set([...(store.releases || []), version]));
          fs.writeFileSync(p, JSON.stringify(store, null, 2) + '\n');
          console.log(`${p}: latest is now ${version}`);
          JS

      # Generated, never hand-edited. The validator refuses an `index.json` that
      # disagrees with the `store.json` files it came from, which is what catches
      # somebody editing the output.
      - name: Rebuild and validate the catalogue
        run: |
          set -euo pipefail
          node scripts/build-index.mjs
          node scripts/validate-catalog.mjs

      - name: Commit the catalogue
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'the catalogue already describes this release, nothing to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json 'extensions/${{ steps.tag.outputs.id }}/store.json'
          git commit -m '${{ steps.tag.outputs.id }} ${{ steps.tag.outputs.version }}'
          git push
