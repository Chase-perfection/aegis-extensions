name: Catalogue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Mirrors backend/src/lib/extensionLoader.js. Also refuses an index.json that
      # disagrees with the store.json files it is generated from.
      - name: Validate the catalogue
        run: node scripts/validate-catalog.mjs

  assets:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      # A catalogue entry pointing at a deleted release passes every field check and
      # still breaks every install, so the URLs get fetched rather than trusted.
      - name: Check every referenced asset resolves
        run: |
          set -euo pipefail
          urls=$(node -e "
            const c = require('./index.json');
            for (const e of c.extensions) console.log(e.download, e.manifest, e.signature);
          " | tr ' ' '\n' | sed '/^$/d')
          if [ -z "$urls" ]; then
            echo "no published extensions yet, nothing to fetch"
            exit 0
          fi
          rc=0
          while read -r u; do
            if curl -fsSIL -o /dev/null "$u"; then
              echo "ok      $u"
            else
              echo "MISSING $u"
              rc=1
            fi
          done <<< "$urls"
          exit $rc
